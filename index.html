<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Star Preparatory School | Quiz Competition</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #071952, #0b3d91, #1261a0);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .school-badge {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: white;
            color: #071952;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .description {
            max-width: 650px;
            margin: 0 auto 45px;
            line-height: 1.7;
            font-size: 1rem;
            opacity: 0.9;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .role-button {
            width: 260px;
            min-height: 150px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            padding: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .role-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .role-button:active {
            transform: translateY(-1px);
        }

        .button-icon {
            display: block;
            font-size: 40px;
            margin-bottom: 12px;
        }

        .teacher-button {
            background: white;
            color: #071952;
        }

        .student-button {
            background: #ffd43b;
            color: #071952;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .role-button {
                width: 100%;
                max-width: 350px;
            }

            .description {
                margin-bottom: 30px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="school-badge">
            SP
        </div>

        <h1>STAR PREPARATORY SCHOOL</h1>

        <p class="subtitle">
            Quiz Competition Platform
        </p>

        <p class="description">
            Welcome to the Star Preparatory School Quiz Competition Platform.
            Test your knowledge, compete with other students, and experience
            an exciting real-time academic competition.
        </p>

        <div class="buttons">

            <button
                class="role-button teacher-button"
                onclick="teacherLogin()"
            >
                <span class="button-icon">👨‍🏫</span>
                Teacher
                <small style="display:block; margin-top:8px; font-weight:normal;">
                    Manage the competition
                </small>
            </button>

            <button
                class="role-button student-button"
                onclick="studentJoin()"
            >
                <span class="button-icon">🎓</span>
                Student
                <small style="display:block; margin-top:8px; font-weight:normal;">
                    Join a quiz
                </small>
            </button>

        </div>

        <div class="footer">
            © 2026 Star Preparatory School
        </div>

    </main>

    <script>
       function teacherLogin() {
    window.location.href = "pages/teacher-login.html";
}

        function studentJoin() {
    window.location.href = "pages/student.html";
}
    </script>

</body>
</html>
