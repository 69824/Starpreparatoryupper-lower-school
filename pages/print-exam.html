<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Print Exam | Star Preparatory School</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;color:#111;background:#eee}.paper{max-width:850px;margin:25px auto;background:#fff;padding:45px;box-shadow:0 2px 12px #bbb}.school{text-align:center;border-bottom:2px solid #111;padding-bottom:15px}.school h1{margin:0;font-size:25px}.school p{margin:5px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.line{border-bottom:1px solid #777;display:inline-block;min-width:200px}.question{margin:22px 0;page-break-inside:avoid}.qtext{font-weight:bold;line-height:1.5}.choice{margin:8px 0 8px 22px}.answer-lines{border-bottom:1px solid #999;height:35px;margin-top:6px}.buttons{position:sticky;top:0;background:#eee;padding:12px;text-align:center}.buttons button{padding:10px 18px;margin:4px;border:0;border-radius:6px;cursor:pointer}.key{display:none}.answer-key .key{display:block}.answer-key .student-paper{display:none}@media print{body{background:#fff}.paper{box-shadow:none;margin:0;max-width:none}.buttons{display:none}.answer-key .key{display:block!important}.answer-key .student-paper{display:none!important}}
</style></head><body>
<div class="buttons"><button onclick="window.print()">🖨️ Print Exam Paper</button><button onclick="toggleKey()">🔑 Show/Hide Answer Key</button></div>
<div id="paper" class="paper"><div class="school"><h1>STAR PREPARATORY SCHOOL</h1><p id="title">EXAMINATION</p></div><div class="meta"><div>Student Name: <span class="line"></span></div><div>Grade: <span id="grade"></span></div><div>Subject: <span id="subject"></span></div><div>Time: <span id="duration"></span> minutes</div><div>Date: <span class="line"></span></div><div>Score: <span class="line"></span></div></div><div class="student-paper" id="studentPaper"></div><div class="key" id="answerKey"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import{getFirestore,doc,getDoc,collection,query,orderBy,getDocs}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAnafAfauEaxRrTRIWrfdLxHL7G5ET463Y",authDomain:"star-preparatory-upper-quiz.firebaseapp.com",projectId:"star-preparatory-upper-quiz",storageBucket:"star-preparatory-upper-quiz.firebasestorage.app",messagingSenderId:"763341549221",appId:"1:763341549221:web:cf77f2e9f227306550674c"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const id=new URLSearchParams(location.search).get("quizId");
function esc(x){return String(x??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
async function load(user){if(!id){document.getElementById("studentPaper").textContent="Missing quiz ID.";return}const qs=await getDoc(doc(db,"quizzes",id));if(!qs.exists()){document.getElementById("studentPaper").textContent="Quiz not found.";return}const quiz=qs.data();if(quiz.teacherId&&quiz.teacherId!==user.uid){document.getElementById("studentPaper").textContent="You can only print quizzes you created.";return}document.getElementById("title").textContent=quiz.title||"EXAMINATION";document.getElementById("grade").textContent=quiz.grade||"";document.getElementById("duration").textContent=quiz.examDurationMinutes||60;const snap=await getDocs(query(collection(db,"quizzes",id,"quizQuestions"),orderBy("order","asc")));let html="<h2>Questions</h2>",key="<h2>Answer Key</h2>";snap.docs.forEach((d,i)=>{const q=d.data(),type=q.questionType||"multiple_choice";html+=`<div class="question"><div class="qtext">${i+1}. ${esc(q.questionText)} <span>(${Number(q.points||1)} marks)</span></div>`;if(type==="multiple_choice"){[["A",q.optionA],["B",q.optionB],["C",q.optionC],["D",q.optionD]].forEach(x=>{html+=`<div class="choice">${x[0]}. ${esc(x[1])}</div>`})}else if(type==="true_false"){html+='<div class="choice">A. True</div><div class="choice">B. False</div>'}else{html+='<div class="answer-lines"></div><div class="answer-lines"></div><div class="answer-lines"></div>'}html+="</div>";let ans=type==="multiple_choice"?q.correctAnswer:type==="true_false"?(q.correctAnswer||""):q.correctTextAnswer||"Teacher marking required";key+=`<div class="question"><div class="qtext">${i+1}. ${esc(ans)} (${Number(q.points||1)} marks)</div></div>`});document.getElementById("studentPaper").innerHTML=html;document.getElementById("answerKey").innerHTML=key}
onAuthStateChanged(auth,u=>{if(u)load(u);else location.href="teacher-login.html"});window.toggleKey=()=>document.getElementById("paper").classList.toggle("answer-key");
</script></body></html>
