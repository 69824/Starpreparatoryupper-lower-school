<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Question Bank | Star Preparatory School</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f7fb;

            color: #222;

        }


        /* ==============================
           SIDEBAR
        ============================== */

        .sidebar {

            position: fixed;

            left: 0;
            top: 0;

            width: 250px;
            height: 100vh;

            background: #071952;

            color: white;

            padding: 25px 15px;

        }


        .school-name {

            text-align: center;

            font-size: 19px;

            font-weight: bold;

            line-height: 1.4;

            padding-bottom: 25px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.2);

        }


        .teacher-label {

            text-align: center;

            margin: 20px 0;

            color: #cbd5e1;

            font-size: 14px;

        }


        .menu {

            list-style: none;

        }


        .menu li {

            margin-bottom: 8px;

        }


        .menu button {

            width: 100%;

            border: none;

            background: transparent;

            color: white;

            text-align: left;

            padding: 13px 15px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;

        }


        .menu button:hover {

            background:
                rgba(255,255,255,0.12);

        }


        .menu button.active {

            background:
                rgba(255,255,255,0.18);

        }


        .logout-button {

            position: absolute;

            bottom: 25px;

            left: 15px;

            width:
                calc(100% - 30px);

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #dc3545;

            color: white;

            cursor: pointer;

            font-weight: bold;

        }


        /* ==============================
           MAIN
        ============================== */

        .main {

            margin-left: 250px;

            padding: 30px;

            min-height: 100vh;

        }


        .topbar {

            background: white;

            padding: 20px 25px;

            border-radius: 12px;

            margin-bottom: 25px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.06);

            display: flex;

            justify-content:
                space-between;

            align-items: center;

        }


        .topbar h1 {

            color: #071952;

            font-size: 25px;

        }


        .back-button {

            border: none;

            background: #071952;

            color: white;

            padding: 10px 16px;

            border-radius: 8px;

            cursor: pointer;

        }


        /* ==============================
           ADD QUESTION
        ============================== */

        .question-form {

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.06);

            margin-bottom: 30px;

        }


        .question-form h2 {

            color: #071952;

            margin-bottom: 20px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

        }


        input,
        textarea,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

        }


        textarea {

            min-height: 100px;

            resize: vertical;

        }


        input:focus,
        textarea:focus,
        select:focus {

            border-color: #071952;

        }


        .options-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

        }


        .form-row {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

        }


        .save-button {

            background: #071952;

            color: white;

            border: none;

            padding: 13px 22px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

        }


        .save-button:hover {

            background: #0b3d91;

        }


        .cancel-button {

            background: #6c757d;

            color: white;

            border: none;

            padding: 13px 22px;

            border-radius: 8px;

            cursor: pointer;

            margin-left: 10px;

            font-size: 16px;

        }


        /* ==============================
           MESSAGE
        ============================== */

        .message {

            display: none;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

        }


        .success {

            background: #d1e7dd;

            color: #0f5132;

        }


        .error {

            background: #f8d7da;

            color: #842029;

        }


        /* ==============================
           QUESTION LIST
        ============================== */

        .question-list {

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.06);

        }


        .question-list-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 20px;

            gap: 15px;

        }


        .question-list-header h2 {

            color: #071952;

        }


        .filters {

            display: flex;

            gap: 10px;

        }


        .filters input {

            width: 250px;

        }


        .question-card {

            border:
                1px solid #e5e7eb;

            border-radius: 10px;

            padding: 20px;

            margin-bottom: 15px;

        }


        .question-card:last-child {

            margin-bottom: 0;

        }


        .question-text {

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        .question-meta {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 15px;

        }


        .badge {

            background: #eef2ff;

            color: #071952;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 12px;

        }


        .options {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 8px;

            margin-bottom: 15px;

        }


        .option {

            background: #f8f9fa;

            padding: 10px;

            border-radius: 6px;

        }


        .correct-option {

            background: #d1e7dd;

            color: #0f5132;

            font-weight: bold;

        }


        .question-actions {

            display: flex;

            gap: 8px;

        }


        .edit-button,
        .delete-button {

            border: none;

            padding: 8px 13px;

            border-radius: 6px;

            cursor: pointer;

            color: white;

        }


        .edit-button {

            background: #0b3d91;

        }


        .delete-button {

            background: #dc3545;

        }


        .empty {

            text-align: center;

            padding: 40px;

            color: #777;

        }


        /* ==============================
           LOADING
        ============================== */

        #loading {

            position: fixed;

            inset: 0;

            background: white;

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 9999;

            color: #071952;

            font-size: 18px;

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 900px) {

            .form-row {

                grid-template-columns: 1fr;

            }

            .options-grid {

                grid-template-columns: 1fr;

            }

            .options {

                grid-template-columns: 1fr;

            }

            .question-list-header {

                flex-direction: column;

                align-items: stretch;

            }

            .filters {

                flex-direction: column;

            }

            .filters input {

                width: 100%;

            }

        }


        @media (max-width: 650px) {

            .sidebar {

                position: relative;

                width: 100%;

                height: auto;

            }

            .logout-button {

                position: static;

                width: 100%;

                margin-top: 20px;

            }

            .main {

                margin-left: 0;

            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     LOADING
========================================== -->

<div id="loading">

    Checking teacher authentication...

</div>



<!-- ==========================================
     SIDEBAR
========================================== -->

<aside class="sidebar">

    <div class="school-name">

        STAR PREPARATORY SCHOOL

        <br>

        <span style="font-size:14px;">
            Quiz Competition
        </span>

    </div>


    <div class="teacher-label">

        👨‍🏫 Teacher

    </div>


    <ul class="menu">

        <li>

            <button
                onclick="window.location.href='teacher-dashboard.html'"
            >

                🏠 Dashboard

            </button>

        </li>


        <li>

            <button class="active">

                📝 Question Bank

            </button>

        </li>


       <li>

    <button
        onclick="window.location.href='create-quiz.html'"
    >

        ➕ Create Quiz

    </button>

</li>


        <li>

            <button>

                🎮 Live Competition

            </button>

        </li>


        <li>

            <button>

                📺 Audience / Projector

            </button>

        </li>


        <li>

            <button>

                📊 Results

            </button>

        </li>

    </ul>


    <button
        id="logoutButton"
        class="logout-button"
    >

        🚪 Logout

    </button>

</aside>



<!-- ==========================================
     MAIN
========================================== -->

<main class="main">


    <div class="topbar">

        <h1>
            Question Bank
        </h1>


        <button
            class="back-button"
            onclick="window.location.href='teacher-dashboard.html'"
        >

            ← Dashboard

        </button>

    </div>



    <!-- ==========================================
         FORM
    ========================================== -->

    <section class="question-form">

        <h2 id="formTitle">

            Add New Question

        </h2>


        <div
            id="message"
            class="message"
        ></div>


        <form id="questionForm">


            <div class="form-group">

                <label for="questionText">

                    Question

                </label>

                <textarea
                    id="questionText"
                    placeholder="Enter the question..."
                    required
                ></textarea>

            </div>



            <div class="form-row">


                <div class="form-group">

                    <label for="grade">

                        Grade

                    </label>

                    <select
                        id="grade"
                        required
                    >

                        <option value="">
                            Select Grade
                        </option>

                        <option value="Grade 4">
                            Grade 4
                        </option>

                        <option value="Grade 5">
                            Grade 5
                        </option>

                        <option value="Grade 6">
                            Grade 6
                        </option>

                        <option value="Grade 7">
                            Grade 7
                        </option>

                        <option value="Grade 8">
                            Grade 8
                        </option>

                        <option value="Grade 9">
                            Grade 9
                        </option>

                    </select>

                </div>



                <div class="form-group">

                    <label for="category">

                        Category

                    </label>

                    <input
                        type="text"
                        id="category"
                        placeholder="e.g. Mathematics"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="points">

                        Points

                    </label>

                    <input
                        type="number"
                        id="points"
                        value="10"
                        min="1"
                        max="100"
                        required
                    >

                </div>


            </div>



            <div class="options-grid">


                <div class="form-group">

                    <label for="optionA">

                        Option A

                    </label>

                    <input
                        type="text"
                        id="optionA"
                        placeholder="Option A"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="optionB">

                        Option B

                    </label>

                    <input
                        type="text"
                        id="optionB"
                        placeholder="Option B"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="optionC">

                        Option C

                    </label>

                    <input
                        type="text"
                        id="optionC"
                        placeholder="Option C"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="optionD">

                        Option D

                    </label>

                    <input
                        type="text"
                        id="optionD"
                        placeholder="Option D"
                        required
                    >

                </div>


            </div>



            <div class="form-row">


                <div class="form-group">

                    <label for="correctAnswer">

                        Correct Answer

                    </label>

                    <select
                        id="correctAnswer"
                        required
                    >

                        <option value="">
                            Select Correct Answer
                        </option>

                        <option value="A">
                            A
                        </option>

                        <option value="B">
                            B
                        </option>

                        <option value="C">
                            C
                        </option>

                        <option value="D">
                            D
                        </option>

                    </select>

                </div>



                <div class="form-group">

                    <label for="timeLimit">

                        Time Limit

                    </label>

                    <select
                        id="timeLimit"
                        required
                    >

                        <option value="5">
                            5 seconds
                        </option>

                        <option
                            value="10"
                            selected
                        >
                            10 seconds
                        </option>

                        <option value="15">
                            15 seconds
                        </option>

                        <option value="20">
                            20 seconds
                        </option>

                        <option value="30">
                            30 seconds
                        </option>

                        <option value="60">
                            60 seconds
                        </option>

                    </select>

                </div>



                <div class="form-group">

                    <label for="difficulty">

                        Difficulty

                    </label>

                    <select
                        id="difficulty"
                        required
                    >

                        <option value="Easy">
                            Easy
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="Hard">
                            Hard
                        </option>

                    </select>

                </div>


            </div>



            <button
                type="submit"
                class="save-button"
                id="saveButton"
            >

                Save Question

            </button>


            <button
                type="button"
                class="cancel-button"
                id="cancelButton"
                style="display:none;"
            >

                Cancel Edit

            </button>


        </form>

    </section>



    <!-- ==========================================
         QUESTION LIST
    ========================================== -->

    <section class="question-list">


        <div class="question-list-header">

            <h2>

                Saved Questions

            </h2>


            <div class="filters">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search questions..."
                >


                <select id="gradeFilter">

                    <option value="all">
                        All Grades
                    </option>

                    <option value="Grade 4">
                        Grade 4
                    </option>

                    <option value="Grade 5">
                        Grade 5
                    </option>

                    <option value="Grade 6">
                        Grade 6
                    </option>

                    <option value="Grade 7">
                        Grade 7
                    </option>

                    <option value="Grade 8">
                        Grade 8
                    </option>

                    <option value="Grade 9">
                        Grade 9
                    </option>

                </select>

            </div>

        </div>


        <div id="questionList">

            <div class="empty">

                Loading questions...

            </div>

        </div>


    </section>


</main>



<!-- ==========================================
     FIREBASE
========================================== -->

<script type="module">


    import {
        initializeApp
    }
    from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {

        getAuth,

        onAuthStateChanged,

        signOut

    }
    from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {

        getFirestore,

        collection,

        addDoc,

        getDocs,

        query,

        where,

        orderBy,

        serverTimestamp,

        doc,

        updateDoc,

        deleteDoc

    }
    from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {
  apiKey: "AIzaSyAnafAfauEaxRrTRIWrfdLxHL7G5ET463Y",
  authDomain: "star-preparatory-upper-quiz.firebaseapp.com",
  projectId: "star-preparatory-upper-quiz",
  storageBucket: "star-preparatory-upper-quiz.firebasestorage.app",
  messagingSenderId: "763341549221",
  appId: "1:763341549221:web:cf77f2f9e227306550674c"
};



    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);



    // ==========================================
    // VARIABLES
    // ==========================================

    let currentUser = null;

    let questions = [];

    let editingQuestionId = null;



    // ==========================================
    // ELEMENTS
    // ==========================================

    const loading =
        document.getElementById("loading");

    const questionForm =
        document.getElementById("questionForm");

    const questionList =
        document.getElementById("questionList");

    const message =
        document.getElementById("message");

    const saveButton =
        document.getElementById("saveButton");

    const cancelButton =
        document.getElementById("cancelButton");

    const searchInput =
        document.getElementById("searchInput");

    const gradeFilter =
        document.getElementById("gradeFilter");



    // ==========================================
    // AUTHENTICATION
    // ==========================================

    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                window.location.href =
                    "teacher-login.html";

                return;

            }


            currentUser = user;


            loading.style.display =
                "none";


            await loadQuestions();

        }
    );



    // ==========================================
    // LOAD QUESTIONS
    // ==========================================

    async function loadQuestions() {

        try {

            questionList.innerHTML = `
                <div class="empty">
                    Loading questions...
                </div>
            `;


            const questionsRef =
                collection(db, "questions");


            const questionsQuery =
                query(

                    questionsRef,

                    where(
                        "teacherId",
                        "==",
                        currentUser.uid
                    ),

                    orderBy(
                        "createdAt",
                        "desc"
                    )

                );


            const snapshot =
                await getDocs(
                    questionsQuery
                );


            questions = [];


            snapshot.forEach(
                (document) => {

                    questions.push({

                        id: document.id,

                        ...document.data()

                    });

                }
            );


            renderQuestions();

        }

        catch (error) {

            console.error(
                "Error loading questions:",
                error
            );


            questionList.innerHTML = `
                <div class="empty">
                    Unable to load questions.
                    Check the browser console for details.
                </div>
            `;

        }

    }



    // ==========================================
    // SAVE QUESTION
    // ==========================================

    questionForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            if (!currentUser) {

                showMessage(
                    "You are not logged in.",
                    "error"
                );

                return;

            }


            const questionData = {

                questionText:
                    document.getElementById(
                        "questionText"
                    ).value.trim(),

                grade:
                    document.getElementById(
                        "grade"
                    ).value,

                category:
                    document.getElementById(
                        "category"
                    ).value.trim(),

                optionA:
                    document.getElementById(
                        "optionA"
                    ).value.trim(),

                optionB:
                    document.getElementById(
                        "optionB"
                    ).value.trim(),

                optionC:
                    document.getElementById(
                        "optionC"
                    ).value.trim(),

                optionD:
                    document.getElementById(
                        "optionD"
                    ).value.trim(),

                correctAnswer:
                    document.getElementById(
                        "correctAnswer"
                    ).value,

                points:
                    Number(
                        document.getElementById(
                            "points"
                        ).value
                    ),

                timeLimit:
                    Number(
                        document.getElementById(
                            "timeLimit"
                        ).value
                    ),

                difficulty:
                    document.getElementById(
                        "difficulty"
                    ).value,

                teacherId:
                    currentUser.uid

            };


            saveButton.disabled =
                true;


            saveButton.textContent =
                editingQuestionId
                    ? "Updating..."
                    : "Saving...";


            try {


                if (editingQuestionId) {


                    const questionRef =
                        doc(
                            db,
                            "questions",
                            editingQuestionId
                        );


                    await updateDoc(
                        questionRef,
                        questionData
                    );


                    showMessage(
                        "Question updated successfully.",
                        "success"
                    );


                }

                else {


                    questionData.createdAt =
                        serverTimestamp();


                    await addDoc(
                        collection(
                            db,
                            "questions"
                        ),
                        questionData
                    );


                    showMessage(
                        "Question saved successfully.",
                        "success"
                    );

                }


                resetForm();


                await loadQuestions();


            }

            catch (error) {

                console.error(
                    "Error saving question:",
                    error
                );


                showMessage(
                    "Unable to save the question. Check the browser console.",
                    "error"
                );

            }


            saveButton.disabled =
                false;


            saveButton.textContent =
                editingQuestionId
                    ? "Update Question"
                    : "Save Question";

        }
    );



    // ==========================================
    // RENDER QUESTIONS
    // ==========================================

    function renderQuestions() {


        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const selectedGrade =
            gradeFilter.value;


        const filtered =
            questions.filter(
                (question) => {


                    const matchesSearch =
                        question.questionText
                            .toLowerCase()
                            .includes(search);


                    const matchesGrade =
                        selectedGrade === "all"
                        ||
                        question.grade ===
                        selectedGrade;


                    return (
                        matchesSearch
                        &&
                        matchesGrade
                    );

                }
            );


        if (filtered.length === 0) {

            questionList.innerHTML = `

                <div class="empty">

                    No questions found.

                </div>

            `;

            return;

        }


        questionList.innerHTML =
            filtered.map(
                (question) => {


                    return `

                        <div
                            class="question-card"
                        >

                            <div
                                class="question-text"
                            >

                                ${escapeHtml(
                                    question.questionText
                                )}

                            </div>


                            <div
                                class="question-meta"
                            >

                                <span class="badge">

                                    ${escapeHtml(
                                        question.grade
                                    )}

                                </span>


                                <span class="badge">

                                    ${escapeHtml(
                                        question.category
                                    )}

                                </span>


                                <span class="badge">

                                    ${question.points}
                                    points

                                </span>


                                <span class="badge">

                                    ${question.timeLimit}
                                    seconds

                                </span>


                                <span class="badge">

                                    ${escapeHtml(
                                        question.difficulty
                                    )}

                                </span>

                            </div>


                            <div
                                class="options"
                            >

                                <div
                                    class="
                                        option
                                        ${
                                            question.correctAnswer
                                            === "A"
                                            ?
                                            "correct-option"
                                            :
                                            ""
                                        }
                                    "
                                >

                                    <strong>A.</strong>
                                    ${escapeHtml(
                                        question.optionA
                                    )}

                                </div>


                                <div
                                    class="
                                        option
                                        ${
                                            question.correctAnswer
                                            === "B"
                                            ?
                                            "correct-option"
                                            :
                                            ""
                                        }
                                    "
                                >

                                    <strong>B.</strong>
                                    ${escapeHtml(
                                        question.optionB
                                    )}

                                </div>


                                <div
                                    class="
                                        option
                                        ${
                                            question.correctAnswer
                                            === "C"
                                            ?
                                            "correct-option"
                                            :
                                            ""
                                        }
                                    "
                                >

                                    <strong>C.</strong>
                                    ${escapeHtml(
                                        question.optionC
                                    )}

                                </div>


                                <div
                                    class="
                                        option
                                        ${
                                            question.correctAnswer
                                            === "D"
                                            ?
                                            "correct-option"
                                            :
                                            ""
                                        }
                                    "
                                >

                                    <strong>D.</strong>
                                    ${escapeHtml(
                                        question.optionD
                                    )}

                                </div>

                            </div>


                            <div
                                class="question-actions"
                            >

                                <button
                                    class="edit-button"
                                    onclick="editQuestion('${question.id}')"
                                >

                                    Edit

                                </button>


                                <button
                                    class="delete-button"
                                    onclick="deleteQuestion('${question.id}')"
                                >

                                    Delete

                                </button>

                            </div>

                        </div>

                    `;

                }
            ).join("");

    }



    // ==========================================
    // EDIT QUESTION
    // ==========================================

    window.editQuestion =
        function(questionId) {


            const question =
                questions.find(
                    (item) =>
                        item.id === questionId
                );


            if (!question) {

                return;

            }


            editingQuestionId =
                questionId;


            document.getElementById(
                "questionText"
            ).value =
                question.questionText;


            document.getElementById(
                "grade"
            ).value =
                question.grade;


            document.getElementById(
                "category"
            ).value =
                question.category;


            document.getElementById(
                "optionA"
            ).value =
                question.optionA;


            document.getElementById(
                "optionB"
            ).value =
                question.optionB;


            document.getElementById(
                "optionC"
            ).value =
                question.optionC;


            document.getElementById(
                "optionD"
            ).value =
                question.optionD;


            document.getElementById(
                "correctAnswer"
            ).value =
                question.correctAnswer;


            document.getElementById(
                "points"
            ).value =
                question.points;


            document.getElementById(
                "timeLimit"
            ).value =
                question.timeLimit;


            document.getElementById(
                "difficulty"
            ).value =
                question.difficulty;


            document.getElementById(
                "formTitle"
            ).textContent =
                "Edit Question";


            saveButton.textContent =
                "Update Question";


            cancelButton.style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        };



    // ==========================================
    // DELETE QUESTION
    // ==========================================

    window.deleteQuestion =
        async function(questionId) {


            const confirmed =
                confirm(
                    "Are you sure you want to delete this question?"
                );


            if (!confirmed) {

                return;

            }


            try {


                await deleteDoc(
                    doc(
                        db,
                        "questions",
                        questionId
                    )
                );


                showMessage(
                    "Question deleted successfully.",
                    "success"
                );


                await loadQuestions();


            }

            catch (error) {

                console.error(
                    "Error deleting question:",
                    error
                );


                showMessage(
                    "Unable to delete question.",
                    "error"
                );

            }

        };



    // ==========================================
    // CANCEL EDIT
    // ==========================================

    cancelButton.addEventListener(
        "click",
        () => {

            resetForm();

        }
    );



    // ==========================================
    // RESET FORM
    // ==========================================

    function resetForm() {


        questionForm.reset();


        document.getElementById(
            "points"
        ).value = 10;


        document.getElementById(
            "timeLimit"
        ).value = 10;


        editingQuestionId =
            null;


        document.getElementById(
            "formTitle"
        ).textContent =
            "Add New Question";


        saveButton.textContent =
            "Save Question";


        cancelButton.style.display =
            "none";

    }



    // ==========================================
    // SEARCH + FILTER
    // ==========================================

    searchInput.addEventListener(
        "input",
        renderQuestions
    );


    gradeFilter.addEventListener(
        "change",
        renderQuestions
    );



    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(
        text,
        type
    ) {


        message.textContent =
            text;


        message.className =
            "message " + type;


        message.style.display =
            "block";


        setTimeout(
            () => {

                message.style.display =
                    "none";

            },
            4000
        );

    }



    // ==========================================
    // HTML ESCAPE
    // ==========================================

    function escapeHtml(value) {


        if (value === undefined ||
            value === null) {

            return "";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }



    // ==========================================
    // LOGOUT
    // ==========================================

    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            async () => {


                try {

                    await signOut(auth);

                    window.location.href =
                        "../index.html";

                }

                catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                }

            }
        );


</script>


</body>
