<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Login | Star Preparatory School</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #071952, #0b3d91, #1261a0);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #222;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .school-badge {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #071952;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #071952;
            font-size: 1.7rem;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #0b3d91;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #071952;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #0b3d91;
        }

        .login-button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
        }

        .success {
            background: #e5f8eb;
            color: #08752b;
        }

        .back-button {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #0b3d91;
            font-weight: bold;
        }

        .back-button:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="school-badge">
            SP
        </div>

        <h1>Teacher Login</h1>

        <p class="subtitle">
            Star Preparatory School
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter teacher email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                Login
            </button>

        </form>

        <a href="../index.html" class="back-button">
            ← Back to Home
        </a>

    </div>

</div>


<!-- Firebase -->
<script type="module">

    import { initializeApp } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // ==========================================
    // YOUR FIREBASE CONFIGURATION
    // ==========================================

    const firebaseConfig = {
  apiKey: "AIzaSyAnafAfauEaxRrTRIWrfdLxHL7G5ET463Y",
  authDomain: "star-preparatory-upper-quiz.firebaseapp.com",
  projectId: "star-preparatory-upper-quiz",
  storageBucket: "star-preparatory-upper-quiz.firebasestorage.app",
  messagingSenderId: "763341549221",
  appId: "1:763341549221:web:cf77f2f9e227306550674c"
};


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    // Initialize Authentication
    const auth = getAuth(app);


    // ==========================================
    // HTML ELEMENTS
    // ==========================================

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");


    // ==========================================
    // MESSAGE FUNCTION
    // ==========================================

    function showMessage(text, type) {

        message.textContent = text;

        message.className = "message " + type;

        message.style.display = "block";
    }


    // ==========================================
    // LOGIN
    // ==========================================

    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        loginButton.disabled = true;

        loginButton.textContent = "Logging in...";

        message.style.display = "none";


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            showMessage(
                "Login successful. Opening dashboard...",
                "success"
            );


            setTimeout(() => {

                window.location.href =
                    "teacher-dashboard.html";

            }, 1000);


        } catch (error) {

            console.error("Login error:", error);

            let errorMessage =
                "Unable to log in. Please check your email and password.";


            if (error.code === "auth/invalid-credential") {

                errorMessage =
                    "Incorrect email or password.";

            }

            else if (error.code === "auth/user-not-found") {

                errorMessage =
                    "No teacher account was found with this email.";

            }

            else if (error.code === "auth/wrong-password") {

                errorMessage =
                    "Incorrect password.";

            }

            else if (error.code === "auth/invalid-email") {

                errorMessage =
                    "Please enter a valid email address.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            loginButton.disabled = false;

            loginButton.textContent = "Login";

        }

    });

</script>

</body>
</html>
